<!doctype html>
<html lang="en" style="background-color: #020617;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA & Mobile App Meta Tags -->
    <title>Pluckk Supplier Portal | Live Mandi Procurement</title>
    <meta name="description" content="Pluckk Fresh Produce Daily Mandi Procurement & Lowest Price (L1) Engine" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    
    <!-- iOS Standalone App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pluckk Vendor" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Android & Windows Standalone Mode -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body style="background-color: #020617; color: #f8fafc; min-height: 100vh;" class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up stale caches and register fresh Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Clear any broken legacy caches from previous versions
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) {
                if (name.includes('pluckk-vendor-cache')) {
                  caches.delete(name);
                }
              }
            });
          }
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration note: ', err);
          });
        });
      }
    </script>
  </body>
</html>
