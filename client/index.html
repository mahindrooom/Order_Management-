    <script>
      // Clean up stale caches and register fresh Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Clear any broken legacy caches from previous versions
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) {
                if (name.includes('pluckk-vendor-cache')) {
                  caches.delete(name);
                }
              }
            });
          }
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration note: ', err);
          });
        });
      }
    </script>
